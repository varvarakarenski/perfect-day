<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Companies</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="menubar">
            <span><h2><a href="index.html">PerfectDay</a></h2></span>
            <a href="companies.html">Companies</a>
            <a href="clubs-and-teams.html">Clubs & Teams</a>
            <a href="labs.html">Labs</a>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">
            <div class="menubar-profile"></div>
        </div>

        <div class="search-bar">
            <input type="search" class="search-input" placeholder="Search companies by name, description, or tag...">
            <button type="button" class="add-listing-toggle">+ Add a company</button>
        </div>

        <div class="perfect-companies">

        </div>

        <div class="add-listing-overlay overlay-backdrop" hidden>
            <div class="overlay-panel">
                <button type="button" class="overlay-close">✕</button>
                <h2>Add a company</h2>
                <form class="add-listing-form">
                    <label>Name <input name="name" required></label>
                    <label>Description <textarea name="description" required></textarea></label>
                    <label>Location <input name="location" required></label>
                    <label>Tags <input name="tags" placeholder="comma-separated"></label>
                    <label>Industry <input name="industry" required></label>
                    <label>Logo URL (optional) <input name="logoUrl" type="url" placeholder="https://..."></label>
                    <button type="submit" class="add-listing-submit">Add company</button>
                </form>
            </div>
        </div>

        <script type="module" src="/src/companies.ts"></script>

        <div class="footer">
            <a href="about.html">About Us</a>
        </div>

    </body>
</html>
