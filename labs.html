<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Labs</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="home.css">
    </head>

    <body>
        <div class="menubar">
            <span><h2><a href="index.html">PerfectDay</a></h2></span>
            <a href="companies.html">Companies</a>
            <a href="clubs-and-teams.html">Clubs & Teams</a>
            <a href="labs.html">Labs</a>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">
            <!--Var, ADD PROFILE PICTURE ON THE RIGHT !!!-->
        </div>

        <div class="search-bar">
            <input type="search" class="search-input" placeholder="Search labs by name, description, or tag...">
            <button type="button" class="add-listing-toggle">+ Add a lab</button>
        </div>

        <div class="perfect-labs">

        </div>

        <div class="add-listing-overlay overlay-backdrop" hidden>
            <div class="overlay-panel">
                <button type="button" class="overlay-close">✕</button>
                <h2>Add a lab</h2>
                <form class="add-listing-form">
                    <label>Lab Name <input name="name" required></label>
                    <label>Institution <input name="institution" required></label>
                    <label>Department <input name="department" required></label>
                    <label>Description <textarea name="description" required></textarea></label>
                    <label>Location <input name="location" required></label>
                    <label>Tags <input name="tags" placeholder="comma-separated"></label>
                    <label>Logo URL (optional) <input name="logoUrl" type="url" placeholder="https://..."></label>
                    <button type="submit">Add lab</button>
                </form>
            </div>
        </div>

        <div class="review-overlay overlay-backdrop" hidden>
            <div class="overlay-panel">
                <button type="button" class="overlay-close">✕</button>
                <h2 class="review-panel-heading"></h2>
                <div class="review-panel-reviews"></div>
                <form class="review-panel-form">
                    <label>Your name <input name="reviewerName" required></label>
                    <label>Rating
                        <select name="rating" required>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Below average</option>
                            <option value="1">1 - Poor</option>
                        </select>
                    </label>
                    <label>Review <textarea name="text" required></textarea></label>
                    <button type="submit">Submit review</button>
                </form>
            </div>
        </div>

        <script type="module" src="/src/labs.ts"></script>

        <div class="footer">
            <a href="about.html">About Us</a>
        </div>

    </body>
</html>
