<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Details</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="menubar">
            <span><h2><a href="index.html">PerfectDay</a></h2></span>
            <a href="companies.html">Companies</a>
            <a href="clubs-and-teams.html">Clubs & Teams</a>
            <a href="labs.html">Labs</a>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">
            <div class="menubar-profile"></div>
        </div>

        <p class="detail-not-found" hidden>We couldn't find that listing.</p>

        <div class="detail-content" hidden>
            <div class="detail-header">
                <div class="detail-header-inner">
                    <a href="#" class="detail-back">&larr; Back</a>
                    <div class="detail-header-row">
                        <img class="detail-logo" alt="">
                        <div>
                            <h1 class="detail-name"></h1>
                            <p class="detail-subtitle"></p>
                        </div>
                    </div>
                </div>
            </div>

            <p class="detail-description"></p>
            <div class="detail-tags"></div>

            <div class="detail-reviews-section">
                <div class="detail-summary-card">
                    <div class="detail-summary-score">
                        <span class="detail-summary-number"></span>
                        <span class="detail-summary-outof">/ 5</span>
                    </div>
                    <div class="detail-summary-meta">
                        <p class="detail-summary-stars"></p>
                        <p class="detail-summary-count"></p>
                        <div class="detail-summary-tags"></div>
                    </div>
                </div>

                <div class="detail-activities">
                    <h2 class="detail-activities-heading"></h2>
                    <p class="detail-activities-text"></p>
                </div>

                <div class="detail-reviews-list">
                    <div class="detail-reviews-list-header">
                        <h2>Reviews</h2>
                        <button type="button" class="detail-review-btn">Write a review</button>
                    </div>
                    <div class="review-panel-reviews detail-reviews"></div>
                </div>
            </div>
        </div>

        <div class="review-overlay overlay-backdrop" hidden>
            <div class="overlay-panel">
                <button type="button" class="overlay-close">✕</button>
                <form class="review-panel-form">
                    <label>Your name <input name="reviewerName" required></label>
                    <label>Rating
                        <div class="star-rating">
                            <button type="button" class="star">★</button>
                            <button type="button" class="star">★</button>
                            <button type="button" class="star">★</button>
                            <button type="button" class="star">★</button>
                            <button type="button" class="star">★</button>
                        </div>
                        <input type="hidden" name="rating">
                    </label>
                    <label>Review <textarea name="text" required></textarea></label>
                    <button type="submit" class="review-panel-submit">Submit review</button>
                </form>
            </div>
        </div>

        <script type="module" src="/src/detail.ts"></script>

        <div class="footer">
            <a href="about.html">About Us</a>
        </div>

    </body>
</html>
