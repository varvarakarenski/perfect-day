<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Clubs and Teams</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="club.svg">
    </head>

    <body>
        <div class="menubar">
            <span><h2><a href="index.html">PerfectDay</a></h2></span>
            <a href="companies.html">Companies</a>
            <a href="clubs-and-teams.html">Clubs & Teams</a>
            <a href="labs.html">Labs</a>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">
            <div class="menubar-profile"></div>
        </div>

        <div class="search-bar">
            <input type="search" class="search-input" placeholder="Search clubs & teams by name, description, or tag...">
            <button type="button" class="add-listing-toggle">+ Add a club or team</button>
        </div>

        <div class="perfect-clubs-and-teams">

        </div>

        <div class="add-listing-overlay overlay-backdrop" hidden>
            <div class="overlay-panel">
                <button type="button" class="overlay-close">✕</button>
                <h2>Add a club or team</h2>
                <form class="add-listing-form">
                    <label>Name <input name="name" required></label>
                    <label>Description <textarea name="description" required></textarea></label>
                    <label>Location <input name="location" required></label>
                    <div class="tag-picker">
                        <span class="tag-picker-label">Tags</span>
                        <div class="tag-picker-options"></div>
                        <input type="hidden" name="tags">
                    </div>
                    <label>Affiliation (school, organization) <input name="affiliation" required></label>
                    <label>Type
                        <select name="kind">
                            <option value="club">club</option>
                            <option value="team">team</option>
                        </select>
                    </label>
                    <label>Logo URL (optional) <input name="logoUrl" type="url" placeholder="https://..."></label>
                    <button type="submit" class="add-listing-submit">Add club or team</button>
                </form>
            </div>
        </div>

        <script type="module" src="/src/teams.ts"></script>

        <div class="footer">
            <a href="https://github.com/varvarakarenski/perfect-day.git" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>

    </body>
</html>
