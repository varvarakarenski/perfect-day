<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Log In</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="menubar">
            <span><h2><a href="index.html">PerfectDay</a></h2></span>
            <a href="companies.html">Companies</a>
            <a href="clubs-and-teams.html">Clubs & Teams</a>
            <a href="labs.html">Labs</a>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&display=swap" rel="stylesheet">
            <div class="menubar-profile"></div>
        </div>

        <div class="auth-page">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" data-mode="login">Log In</button>
                    <button type="button" class="auth-tab" data-mode="signup">Sign Up</button>
                </div>

                <button type="button" class="auth-google-btn">
                    <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
                        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.85.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
                        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
                        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>

                <div class="auth-divider"><span>or</span></div>

                <form class="auth-form">
                    <label>Email <input name="email" type="email" required autocomplete="email"></label>
                    <label>Password <input name="password" type="password" required autocomplete="current-password" minlength="6"></label>
                    <p class="auth-error" hidden></p>
                    <button type="submit" class="auth-submit">Log In</button>
                </form>

                <p class="auth-switch">
                    <span class="auth-switch-copy" data-mode="login">Don't have an account? <button type="button" class="auth-switch-link" data-mode="signup">Sign up</button></span>
                    <span class="auth-switch-copy" data-mode="signup" hidden>Already have an account? <button type="button" class="auth-switch-link" data-mode="login">Log in</button></span>
                </p>
            </div>
        </div>

        <script type="module" src="/src/auth.ts"></script>

        <div class="footer">
            <a href="https://github.com/varvarakarenski/perfect-day.git" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>

    </body>
</html>
